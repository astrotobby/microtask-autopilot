name: Hourly public opportunity monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-public-opportunity-monitor
  cancel-in-progress: false

jobs:
  scan-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate platform registry safety rules
        run: python -m unittest discover -s tests -v
      - name: Scan, score and classify public listings
        run: python microtask_monitor/scan_feeds.py
      - name: Save HTML, JSON and CSV reports
        uses: actions/upload-artifact@v4
        with:
          name: hourly-opportunity-report
          path: |
            microtask_monitor/reports/*.json
            microtask_monitor/reports/*.csv
            microtask_monitor/reports/*.html
          if-no-files-found: error
          retention-days: 14
