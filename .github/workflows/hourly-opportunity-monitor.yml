name: Hourly public opportunity monitor

on:
  push:
    branches:
      - main
    paths:
      - "microtask_monitor/**"
      - "tests/**"
      - "dashboard/**"
      - ".github/workflows/hourly-opportunity-monitor.yml"
  schedule:
    - cron: "17 * * * *"
    # 05:00 UTC = 08:00 East Africa Time (Africa/Nairobi, UTC+3). GitHub may delay scheduled runs.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-public-opportunity-monitor
  cancel-in-progress: false

jobs:
  scan-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore adapter cache (OpenTrain results, Mindrift policy check)
        uses: actions/cache@v4
        with:
          path: microtask_monitor/cache
          key: adapter-cache-${{ github.run_id }}
          restore-keys: |
            adapter-cache-
      - name: Validate platform registry safety rules
        run: python -m unittest discover -s tests -v
      - name: Scan feeds and run the 12-platform adapters
        # OpenTrain: documented public API. Mindrift: public eligibility-policy monitor only.
        # GainWorkers / REWORKIO: manual-review integrations, no network access.
        env:
          ANALYSIS_TRIGGER: ${{ github.event.schedule == '0 5 * * *' && 'daily' || 'hourly' }}
        run: python microtask_monitor/scan_feeds.py
      - name: Save HTML, JSON and CSV reports
        uses: actions/upload-artifact@v4
        with:
          name: hourly-opportunity-report
          path: |
            microtask_monitor/reports/*.json
            microtask_monitor/reports/*.csv
            microtask_monitor/reports/*.html
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest report JSON to report-data branch
        # Artifact downloads need authentication; this public copy does not.
        run: |
          set -e
          latest=$(ls microtask_monitor/reports/*.json | sort | tail -n 1)
          cp "$latest" "$RUNNER_TEMP/latest.json"
          # Resumable, integrity-checked copy: gzip + manifest (sizes and SHA-256 of both files).
          gzip -9 -n -c "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/latest.json.gz"
          python - <<'PYEOF'
          import hashlib, json, os, pathlib
          t = pathlib.Path(os.environ["RUNNER_TEMP"])
          raw, gz = (t / "latest.json").read_bytes(), (t / "latest.json.gz").read_bytes()
          manifest = {"sha256": hashlib.sha256(raw).hexdigest(), "size": len(raw),
                      "gz_sha256": hashlib.sha256(gz).hexdigest(), "gz_size": len(gz),
                      "run_id": os.environ.get("GITHUB_RUN_ID"), "generated_by": "hourly-opportunity-monitor"}
          (t / "latest.manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan report-data-tmp
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/latest.json" latest.json
          cp "$RUNNER_TEMP/latest.json.gz" latest.json.gz
          cp "$RUNNER_TEMP/latest.manifest.json" latest.manifest.json
          git add latest.json latest.json.gz latest.manifest.json
          git commit --quiet -m "Publish latest opportunity report"
          git push --force origin HEAD:refs/heads/report-data
