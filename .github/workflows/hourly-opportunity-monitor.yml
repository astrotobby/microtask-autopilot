name: Cloud opportunity monitor (15-minute)

on:
  push:
    branches:
      - main
    paths:
      - "microtask_monitor/**"
      - "tests/**"
      - "dashboard/**"
      - ".github/workflows/hourly-opportunity-monitor.yml"
  pull_request:
    branches:
      - main
    paths:
      - "microtask_monitor/**"
      - "tests/**"
      - "dashboard/**"
      - ".github/workflows/hourly-opportunity-monitor.yml"
  schedule:
    # Best-effort cloud discovery while the owner's PC is offline. GitHub may delay scheduled runs.
    - cron: "7,22,37,52 * * * *"
    # Daily full validation and analysis at 08:00 East Africa Time / Africa/Nairobi (05:00 UTC).
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-public-opportunity-monitor
  cancel-in-progress: false

jobs:
  scan-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Restore adapter cache (OpenTrain results, Mindrift policy check)
        uses: actions/cache@v4
        with:
          path: microtask_monitor/cache
          key: adapter-cache-${{ github.run_id }}
          restore-keys: |
            adapter-cache-
      - name: Run the full test suite on code changes, manual runs and daily validation
        if: github.event_name != 'schedule' || github.event.schedule == '0 5 * * *'
        run: python -m unittest discover -s tests -v
      - name: Run focused safety checks on frequent scheduled scans
        if: github.event_name == 'schedule' && github.event.schedule != '0 5 * * *'
        run: |
          python -m unittest discover -s tests -p 'test_platform_registry.py' -v
          python -m unittest discover -s tests -p 'test_policy.py' -v
          python -m unittest discover -s tests -p 'test_opentrain.py' -v
          python -m unittest discover -s tests -p 'test_whop.py' -v
      - name: Scan the 27-platform directory and permitted public sources
        # Public feeds, OpenTrain's documented public API, Mindrift's public policy monitor.
        # Account-facing platforms remain manual unless they provide explicit worker-side permission and a documented interface.
        env:
          ANALYSIS_TRIGGER: ${{ github.event.schedule == '0 5 * * *' && 'daily' || 'hourly' }}
        run: python microtask_monitor/scan_feeds.py
      - name: Save HTML, JSON and CSV reports
        uses: actions/upload-artifact@v4
        with:
          name: hourly-opportunity-report
          path: |
            microtask_monitor/reports/*.json
            microtask_monitor/reports/*.csv
            microtask_monitor/reports/*.html
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest report JSON to report-data branch
        # Public report mirror lets the local engine catch up after the PC returns online.
        run: |
          set -e
          latest=$(ls microtask_monitor/reports/*.json | sort | tail -n 1)
          cp "$latest" "$RUNNER_TEMP/latest.json"
          gzip -9 -n -c "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/latest.json.gz"
          python - <<'PYEOF'
          import hashlib, json, os, pathlib
          t = pathlib.Path(os.environ["RUNNER_TEMP"])
          raw, gz = (t / "latest.json").read_bytes(), (t / "latest.json.gz").read_bytes()
          manifest = {"sha256": hashlib.sha256(raw).hexdigest(), "size": len(raw),
                      "gz_sha256": hashlib.sha256(gz).hexdigest(), "gz_size": len(gz),
                      "run_id": os.environ.get("GITHUB_RUN_ID"), "generated_by": "hourly-opportunity-monitor"}
          (t / "latest.manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan report-data-tmp
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/latest.json" latest.json
          cp "$RUNNER_TEMP/latest.json.gz" latest.json.gz
          cp "$RUNNER_TEMP/latest.manifest.json" latest.manifest.json
          git add latest.json latest.json.gz latest.manifest.json
          git commit --quiet -m "Publish latest opportunity report"
          git push --force origin HEAD:refs/heads/report-data
